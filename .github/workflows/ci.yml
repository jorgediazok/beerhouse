name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # `next build` runs its own full TypeScript check as part of the build
      # (its output already includes a "Running TypeScript" step) — a
      # standalone `tsc --noEmit` here would fail on a clean checkout, since
      # Next's PageProps/LayoutProps types only exist under .next/types
      # after dev/build has run at least once.
      - run: npm run build
